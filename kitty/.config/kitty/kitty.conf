# vim:ft=kitty

## Theme - load from Omarchy
# Note the "theme/" segment: current/kitty.conf is a dangling symlink into the
# old ~/.dotfiles/themes tree, so kitty silently rendered with no theme colors.
include ~/.local/state/omarchy/current/theme/kitty.conf

## Shell
shell /bin/zsh

## Font
font_size 16
font_family JetBrainsMono Nerd Font

## macOS
macos_option_as_alt yes
confirm_os_window_close 0

## Cursor
cursor_blink_interval 0

## Copy on select
copy_on_select clipboard

## Clipboard
# Omarchy's universal copy/paste (SUPER+C / SUPER+V) sends Ctrl+Insert /
# Shift+Insert to terminals. Kitty's default maps shift+insert to
# paste_from_selection (PRIMARY), so SUPER+V pasted the last mouse selection
# instead of what was copied. These match Omarchy's stock kitty.conf.
# Harmless on macOS, where Cmd+C/Cmd+V are handled natively.
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

## Colors loaded from theme via include above

wayland_titlebar_color  system
macos_titlebar_color    system
tab_bar_edge            top

## Splits (--cwd=current keeps same directory)
map cmd+d launch --location=hsplit --cwd=current
map cmd+s launch --location=vsplit --cwd=current
# ctrl+w disabled - conflicts with nvim window navigation
# map ctrl+w close_window
map cmd+w close_window
map ctrl+d discard_event

## Tabs (--cwd=current keeps same directory)
map ctrl+t launch --type=tab --cwd=current
map cmd+t launch --type=tab --cwd=current

## New OS window (--cwd=current keeps same directory)
map cmd+n launch --type=os-window --cwd=current
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map cmd+[ previous_window
map cmd+] next_window
map ctrl+cmd+[ move_window_backward
map ctrl+cmd+] move_window_forward
map ctrl+cmd+n detach_window new

## Window layout
enabled_layouts splits,stack

paste_actions no-op

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow cwd lookup from global keybindings.
# listen_on does nothing without allow_remote_control, so omarchy-cmd-terminal-cwd
# could never reach the socket and SUPER+RETURN always opened in $HOME.
# socket-only is enough for it (it connects with --to) and, unlike Omarchy's
# stock "yes", does not let programs inside the terminal drive kitty via escapes.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
