# Reference: https://github.com/i3/i3/blob/next/etc/config

# Login startup is managed by ./wm.sh default; see YABAI.md.
start-at-login = false

after-startup-command = [
    # JankyBorders - colors loaded from Omarchy theme
    # sketchybar has built-in detection of already running process
    'exec-and-forget source ~/.config/omarchy/current/borders.sh && borders active_color=$BORDER_ACTIVE inactive_color=$BORDER_INACTIVE width=$BORDER_WIDTH',
    'exec-and-forget sketchybar',
    # 1s refresh poller — covers same-app window closes, which AeroSpace's async
    # pipeline never notices on its own (#1615). See comments in the script.
    'exec-and-forget $HOME/dotfiles/aerospace-poll.sh',
    'exec-and-forget $HOME/dotfiles/switch-display-mode.sh'
]

# Notify Sketchybar about workspace change; re-poll aerospace so windows closed while
# this workspace was in the background get re-tiled on arrival (see #1615 workaround below)
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; $HOME/dotfiles/aerospace-retile.sh &'
]

# Keep the service indicator in sync with every entry and exit path.
on-mode-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_changed']

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Workaround for delayed re-tiling on window open/close since 0.20/0.21 async rewrite.
# Single-flight re-poll script — see comments in ~/dotfiles/aerospace-retile.sh.
on-focus-changed = ['exec-and-forget $HOME/dotfiles/aerospace-retile.sh']

[gaps]
inner.horizontal = 15
inner.vertical =   15
outer.left =       10
outer.bottom =     8
# Per-monitor top gap. The built-in display needs only 16 because the notch makes
# the native menu bar taller, so windows already start below the 40pt sketchybar.
# Any other single display has no notch — Screen Sharing's virtual display is
# 1440x900 logical — so 16 puts windows *under* the bar. Last bare value = default.
outer.top =        [{ monitor.'built-in' = 16 }, 50]
outer.right =      10


[mode.main.binding]

    # Disable "hide application" shortcuts
    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    cmd-left = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace left --focus'
    cmd-down = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace down --focus'
    cmd-up = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace up --focus'
    cmd-right = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace right --focus'

    cmd-shift-left = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace left'
    cmd-shift-down = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace down'
    cmd-shift-up = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace up'
    cmd-shift-right = 'exec-and-forget /usr/bin/python3 "$HOME/dotfiles/wm-direction.py" aerospace right'


    cmd-equal = ['resize width +32']
    cmd-minus = ['resize width -32']
    cmd-shift-equal = ['resize height +32']
    cmd-shift-minus = ['resize height -32']
    cmd-0 = 'balance-sizes' # Reset window sizes in the current workspace

    cmd-j = 'layout tiles horizontal vertical'
    cmd-comma = 'layout accordion horizontal vertical'
    cmd-f = 'fullscreen'

    # =========================================================================
    # WORKSPACE KEYBOARD SHORTCUTS
    # =========================================================================
    # To add more workspaces (e.g., workspace 5-9):
    # 1. Add: cmd-N = 'workspace N'
    # 2. Add: cmd-shift-N = 'move-node-to-workspace N --focus-follows-window'
    # 3. Update cmd-end to point to last workspace
    # 4. Update WORKSPACE_COUNT in sketchybar/items/spaces.lua
    # =========================================================================

    # Switch to workspace
    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'

    cmd-7 = 'workspace 7'
    cmd-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    cmd-keypad7 = 'workspace 7'
    cmd-shift-keypad7 = 'move-node-to-workspace 7 --focus-follows-window'
    cmd-8 = 'workspace 8'
    cmd-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    cmd-keypad8 = 'workspace 8'
    cmd-shift-keypad8 = 'move-node-to-workspace 8 --focus-follows-window'
    cmd-9 = 'workspace 9'
    cmd-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    cmd-keypad9 = 'workspace 9'
    cmd-shift-keypad9 = 'move-node-to-workspace 9 --focus-follows-window'

    cmd-keypad1 = 'workspace 1'
    cmd-keypad2 = 'workspace 2'
    cmd-keypad3 = 'workspace 3'
    cmd-keypad4 = 'workspace 4'
    cmd-keypad5 = 'workspace 5'
    cmd-keypad6 = 'workspace 6'

    cmd-pageUp = ['workspace prev']
    cmd-pageDown = ['workspace next']

    cmd-home = ['workspace 1']
    cmd-end = ['workspace 6']  # Update this when adding more workspaces

    # Move window to workspace
    cmd-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    cmd-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    cmd-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    cmd-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    cmd-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    cmd-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'

    cmd-shift-keypad1 = 'move-node-to-workspace 1 --focus-follows-window'
    cmd-shift-keypad2 = 'move-node-to-workspace 2 --focus-follows-window'
    cmd-shift-keypad3 = 'move-node-to-workspace 3 --focus-follows-window'
    cmd-shift-keypad4 = 'move-node-to-workspace 4 --focus-follows-window'
    cmd-shift-keypad5 = 'move-node-to-workspace 5 --focus-follows-window'
    cmd-shift-keypad6 = 'move-node-to-workspace 6 --focus-follows-window'

    alt-tab = 'workspace-back-and-forth'
    # Move the focused window and follow it, wrapping between monitors.
    cmd-ctrl-right = 'move-node-to-monitor --wrap-around next --focus-follows-window'
    cmd-ctrl-left = 'move-node-to-monitor --wrap-around prev --focus-follows-window'

    cmd-alt-s = 'mode service'
    f14 = 'mode service'

    alt-shift-c = 'reload-config'

    # Reset view to default split
    cmd-ctrl-alt-shift-d = 'flatten-workspace-tree'

    # Floating window
    # Float toggle: when a window BECOMES floating, shrink it to 1600x1000 so it
    # visibly pops out of the layout (AeroSpace has no float-size memory).
    cmd-ctrl-shift-f = 'exec-and-forget $HOME/dotfiles/aerospace-float-toggle.sh'
    cmd-ctrl-alt-shift-f = 'exec-and-forget $HOME/dotfiles/aerospace-float-toggle.sh'

    # Modes
    cmd-ctrl-alt-shift-m = 'mode merge'
    cmd-ctrl-alt-shift-w = 'mode workspace'
    cmd-ctrl-alt-shift-r = 'mode resize'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    f15 = 'mode main'
    space = 'mode main'
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['exec-and-forget $HOME/dotfiles/aerospace-float-toggle.sh', 'mode main'] # Float toggle, shrinks on float
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    cmd-shift-left = ['join-with left', 'mode main']
    cmd-shift-down = ['join-with down', 'mode main']
    cmd-shift-up = ['join-with up', 'mode main']
    cmd-shift-right = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# Single monitor setup - all workspaces on main monitor
# [workspace-to-monitor-force-assignment]


[mode.merge.binding]
    space = 'mode main'
    esc = 'mode main'

    left = ['join-with left', 'mode main']
    down = ['join-with down', 'mode main']
    up = ['join-with up', 'mode main']
    right = ['join-with right', 'mode main']


[mode.resize.binding]
    space = 'mode main'
    esc = 'mode main'

    left = ['resize width -16']
    down = ['resize height -16']
    up = ['resize height +16']
    right = ['resize width +16']

    shift-left = ['resize width -64']
    shift-down = ['resize height -64']
    shift-up = ['resize height +64']
    shift-right = ['resize width +64']


[mode.workspace.binding]
    space = 'mode main'
    esc = 'mode main'

    left = ['workspace prev', 'move-mouse window-force-center']
    right = ['workspace next', 'move-mouse window-force-center']
    up = ['focus-monitor prev', 'move-mouse window-force-center']
    down = ['focus-monitor next', 'move-mouse window-force-center']
    
    shift-right = ['move-node-to-workspace next --focus-follows-window']
    shift-left = ['move-node-to-workspace prev --focus-follows-window']
    shift-up = ['move-node-to-monitor prev --focus-follows-window']
    shift-down = ['move-node-to-monitor next --focus-follows-window']



#
# Application-specific configurations
#

[[on-window-detected]]
if.app-name-regex-substring = 'Code - Insiders|Cursor|Simulator|Warp|Xcode|Sublime|iTerm|terminal|VSCode'
run = ['layout tiling', 'move-node-to-workspace 3']

# Disabled: with 0.20/0.21's delayed window detection, move-on-detect makes new
# Chrome windows appear in place, then visibly teleport — reads as a bug.
# [[on-window-detected]]
# if.app-id = 'com.google.Chrome'
# run = "move-node-to-workspace 1"


[[on-window-detected]]
if.app-name-regex-substring = 'Basecamp'
run = ['layout tiling', 'move-node-to-workspace 6']

[[on-window-detected]]
if.app-name-regex-substring = 'Hey|Mail'
run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-name-regex-substring = 'Figma|Framer'
run = ['layout tiling', 'move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['layout tiling', 'move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['layout tiling', 'move-node-to-workspace 5']

[[on-window-detected]]
if.app-name-regex-substring = 'Obsidian|Notes'
run = ['layout tiling', 'move-node-to-workspace 5']

# Float Nuvio: tiled video stutters because forced refreshes (aerospace-retile.sh
# workaround for #1615) re-apply layout to tiled windows; floating windows are exempt.
[[on-window-detected]]
if.app-id = 'com.nuvio.media.desktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.clock'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.FaceTime'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id="com.mitchellh.ghostty"
run= "layout tiling"
